services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: findthatshit
      POSTGRES_PASSWORD: findthatshit
      POSTGRES_DB: findthatshit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findthatshit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./Backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://findthatshit:findthatshit@db:5432/findthatshit
      REDIS_URL: redis://redis:6379/0
    volumes: ["./Backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./Backend
    command: celery -A config worker -l info
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://findthatshit:findthatshit@db:5432/findthatshit
      REDIS_URL: redis://redis:6379/0
    volumes: ["./Backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
